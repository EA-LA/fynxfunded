name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm test
      - run: npm run test:functions
      - run: npm run test:mfa
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npx --yes firebase-tools@15.8.0 emulators:exec --config scripts/firebase-retention-emulator.json --only firestore --project demo-funded-retention "node scripts/rehearse-ios-operations.cjs"

  trade-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@15.8.0
      - name: Run isolated trading acceptance
        run: |
          npm run dev:trade > /tmp/fynx-trade.log 2>&1 &
          node <<'NODE'
          (async () => {
            for (let i = 0; i < 240; i++) {
              try {
                const r = await fetch('http://127.0.0.1:5009/demo-fynx-trade/us-central1/fynxTradeDev');
                if (r.status === 400 && r.headers.get('content-type')?.includes('application/json')) return;
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            throw Error('Trading emulator startup timed out');
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
          node scripts/trade-dev/acceptance.cjs
          node scripts/trade-dev/access-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-development-acceptance
          path: |
            docs/fynx-trade-dev/acceptance.json
            /tmp/fynx-trade.log
